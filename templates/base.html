<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Talha Javed{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            {% for item in navigation %}
            {% if item.params %}
            <a href="{{ url_for(item.route, **item.params) }}">{{ item.title }}</a>
            {% else %}
            <a href="{{ url_for(item.route) }}">{{ item.title }}</a>
            {% endif %}
            {% endfor %}
        </nav>
    </header>

    <div class="container">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer>
        <p>&copy; {{ current_year() }} Talha Javed &mdash; Built with Flask & Frozen-Flask</p>
    </footer>
</body>
</html>
